spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/cakes}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      springframework:
        security: INFO
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

app:
  base-url: ${BASE_URL:http://localhost:8080}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_key_id}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_key_secret}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:public/images}