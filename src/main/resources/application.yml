server:
  port: 8080

spring:
  application:
    name: cakes

  profiles:
    active: local

  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-development-secret-to-a-256-bit-value}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT1H}